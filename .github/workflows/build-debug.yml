name: Build APK Debug

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da Release (ex: v1.0.0)'
        required: false
        type: string

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_PATH: app/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Validate env vars
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set as GitHub Secrets"
            exit 1
          fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK Release
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Copy APK to public/
        run: |
          apk_path=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$apk_path" ]; then
            echo "ERROR: No APK found in release output"
            exit 1
          fi
          cp "$apk_path" public/VSFit-Personal.apk
          echo "APK copied: $apk_path -> public/VSFit-Personal.apk"
          ls -lh public/VSFit-Personal.apk

      - name: Commit APK update back to main [skip ci]
        run: |
          git config user.name "VSFit Bot"
          git config user.email "bot@vsfit.app"
          git add public/VSFit-Personal.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, skipping commit"
          else
            git commit -m "chore: update APK [skip ci]"
            git remote set-url origin https://x-access-token:${{ secrets.PUSH_TOKEN }}@github.com/lslp3/vsfit-personal.git
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vsfit-personal-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 15