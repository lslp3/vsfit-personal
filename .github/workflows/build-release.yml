name: Build APK + AAB Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (ex: 1.0.0). Opcional — usado em workflow_dispatch.'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Version code (integer). Opcional — usado em workflow_dispatch.'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  build:
    name: Build APK + AAB Release
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_PATH: release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Inject Firebase config (google-services.json)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            test -s android/app/google-services.json || { echo "ERROR: google-services.json decode failed"; exit 1; }
            echo "Firebase config injectado (FCM habilitado)."
          else
            echo "AVISO: GOOGLE_SERVICES_JSON nao configurado — APK sem FCM."
          fi

      - name: Validate env vars
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set as GitHub Secrets"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD must be set as GitHub Secrets"
            exit 1
          fi
          test -s android/app/release.keystore || { echo "ERROR: release.keystore was not decoded"; exit 1; }

      - name: Resolve version name/code (manual or auto from push)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version_name=${{ steps.ver.outputs.version_name }}"

      - name: Update version
        working-directory: android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.version_code }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.ver.outputs.version_name }}\"/" build.gradle

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK Release (signed)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build AAB Release (signed)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Rename artifacts
        working-directory: android/app/build/outputs
        run: |
          cp apk/release/*.apk vsfit-personal-v${{ steps.ver.outputs.version_name }}.apk
          cp apk/release/*.apk vsfit-personal.apk
          cp bundle/release/*.aab vsfit-personal-v${{ steps.ver.outputs.version_name }}.aab
          ls -la .

      - name: Verify artifacts
        working-directory: android
        run: |
          # Assinatura ja aplicada pelo Gradle (signingConfig release + keystore oficial).
          # Aqui apenas confirmamos existencia, tamanho e integridade do zip.
          APK=$(ls app/build/outputs/apk/release/*.apk)
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          test -s "$APK" || { echo "ERROR: APK vazio ou ausente"; exit 1; }
          test -s "$AAB" || { echo "ERROR: AAB vazio ou ausente"; exit 1; }
          echo "APK: $(stat -c '%s bytes' "$APK")"
          echo "AAB: $(stat -c '%s bytes' "$AAB")"
          unzip -t "$AAB" | tail -1
          unzip -t "$APK" | tail -1

      - name: Upload APK Release (backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vsfit-personal-v${{ steps.ver.outputs.version_name }}-apk
          path: android/app/build/outputs/vsfit-personal-v${{ steps.ver.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload AAB Release (backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vsfit-personal-v${{ steps.ver.outputs.version_name }}-aab
          path: android/app/build/outputs/vsfit-personal-v${{ steps.ver.outputs.version_name }}.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK (GitHub Release — fonte oficial da landing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "VSFit Personal — latest (${{ steps.ver.outputs.version_name }})"
          body: |
            APK gerado automaticamente após push/merge na `main`.
            - Versão: ${{ steps.ver.outputs.version_name }} (code ${{ steps.ver.outputs.version_code }})
            - Commit: ${{ github.sha }}
            - Run: ${{ github.run_number }}
            Asset fixo `vsfit-personal.apk` — a landing usa a URL estável
            `releases/latest/download/vsfit-personal.apk`.
          files: android/app/build/outputs/vsfit-personal.apk
          overwrite: true
          force_tag: true
          make_latest: true
