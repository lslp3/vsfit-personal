name: Build APK + AAB Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '2'

permissions:
  contents: read

jobs:
  build:
    name: Build APK + AAB Release
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ANDROID_KEYSTORE_PATH: release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Validate env vars
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set as GitHub Secrets"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD must be set as GitHub Secrets"
            exit 1
          fi
          test -s android/app/release.keystore || { echo "ERROR: release.keystore was not decoded"; exit 1; }

      - name: Update version
        working-directory: android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version_code }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" build.gradle

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK Release (signed)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build AAB Release (signed)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Rename artifacts
        working-directory: android/app/build/outputs
        run: |
          cp apk/release/*.apk vsfit-personal-v${{ inputs.version_name }}.apk
          cp bundle/release/*.aab vsfit-personal-v${{ inputs.version_name }}.aab
          ls -la .

      - name: Verify signing
        working-directory: android
        run: |
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/release/*.apk
          echo "AAB is signed by Gradle (jarsigner) if key matches"

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: vsfit-personal-v${{ inputs.version_name }}-apk
          path: android/app/build/outputs/vsfit-personal-v${{ inputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: vsfit-personal-v${{ inputs.version_name }}-aab
          path: android/app/build/outputs/vsfit-personal-v${{ inputs.version_name }}.aab
          if-no-files-found: error
          retention-days: 90
