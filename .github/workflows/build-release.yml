name: Build APK Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '1'
      create_release:
        description: 'Create GitHub Release?'
        required: true
        type: boolean
        default: false

env:
  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update version
        working-directory: android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version_code }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" build.gradle

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK Release (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK Release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: ilharp/sign-android-release@v1
        with:
          releaseDir: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          if [ -f "app-release-signed.apk" ]; then
            mv app-release-signed.apk vsfit-personal-v${{ inputs.version_name }}.apk
          elif [ -f "app-release-unsigned.apk" ]; then
            mv app-release-unsigned.apk vsfit-personal-v${{ inputs.version_name }}-unsigned.apk
          fi

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: vsfit-personal-v${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: inputs.create_release && env.RELEASE_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: VSFit Personal v${{ inputs.version_name }}
          body: |
            ## VSFit Personal v${{ inputs.version_name }}

            APK assinado gerado automaticamente via GitHub Actions.

            ### Como instalar
            1. Baixe o APK anexado
            2. Abra no seu dispositivo Android
            3. Confirme a instalação de fontes desconhecidas
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false