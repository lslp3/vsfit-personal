name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate Debug APK
        id: debug_apk
        run: |
          APK=$(find android -name '*-debug.apk' -type f | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VSFit-Personal-Debug
          path: ${{ steps.debug_apk.outputs.path }}
          if-no-files-found: error

      - name: Decode Keystore (secrets found)
        if: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_B64 != '' }}
        run: |
          echo "${{ secrets.MYAPP_UPLOAD_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore

      - name: Build Release APK (signed)
        if: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_B64 != '' }}
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK (if built)
        if: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VSFit-Personal-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}.0.0
          name: Release v${{ github.run_number }}.0.0
          body: |
            ## VSFit Personal — Build Automático

            **Commit:** ${{ github.sha }}

            | APK | Download |
            |---|---|
            | Debug | `${{ steps.debug_apk.outputs.name }}` |

            > Para gerar APK Release assinado, configure as secrets:
            > `MYAPP_UPLOAD_KEYSTORE_B64`, `MYAPP_UPLOAD_STORE_PASSWORD`,
            > `MYAPP_UPLOAD_KEY_ALIAS`, `MYAPP_UPLOAD_KEY_PASSWORD`
          files: |
            ${{ steps.debug_apk.outputs.path }}
          generate_release_notes: false
          fail_on_unmatched_files: false